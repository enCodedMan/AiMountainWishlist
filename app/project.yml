# XcodeGen project spec for "Stones" (PD-004). This file is the source of
# truth for the Xcode project; the generated .xcodeproj is NOT committed
# (see app/.gitignore) — regenerate it any time with:
#
#   brew install xcodegen   (one-time)
#   cd app && xcodegen generate
#   open Stones.xcodeproj
#
# Domain logic lives in the local LifeAchievementCore Swift package
# (app/LifeAchievementCore/), which has zero UIKit/SwiftUI/Supabase
# dependencies and can also be tested directly without Xcode via:
#
#   cd app/LifeAchievementCore && swift test

name: Stones

options:
  bundleIdPrefix: com.stonesapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

packages:
  LifeAchievementCore:
    path: LifeAchievementCore

targets:
  LifeAchievementApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LifeAchievementApp
    dependencies:
      - package: LifeAchievementCore
        product: LifeAchievementCore
    settings:
      base:
        PRODUCT_NAME: Stones
        PRODUCT_BUNDLE_IDENTIFIER: com.stonesapp.Stones
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for M0/M1; iPad support is a later decision
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        # No ASSETCATALOG_COMPILER_APPICON_NAME yet: there's no
        # Assets.xcassets/AppIcon in this scaffold, and setting this
        # without a matching asset catalog entry fails the build. Add
        # both together once real app-icon artwork exists.
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Stones
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  Stones:
    build:
      targets:
        LifeAchievementApp: all
    run:
      config: Debug
    archive:
      config: Release
